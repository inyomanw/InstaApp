[versions]
agp = "8.10.0"
kotlin = "2.0.21"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"

lifecycleViewmodel = "2.9.1"
ksp = "2.0.21-1.0.28"
coil = "2.5.0"
hilt = "2.56.2"
gson = '2.11.0'
retrofit = '2.9.0'
okhttp = '4.11.0'
coroutinesCore = '1.7.3'
coroutinesAndroid = '1.7.3'
lifecycle = '2.2.0'
chucker = '4.0.0'
pagingVersion = "3.3.6"
navigationFragment = "2.7.7"
firebaseBom = "33.1.2"
playServicesAuth = "21.2.0"
credentialsManager = "1.2.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

lifecycle-extensions = { group = "androidx.lifecycle", name ="lifecycle-extensions", version.ref = "lifecycle"}
lifecycle-viewmodel = { group = "androidx.lifecycle", name ="lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodel"}

chucker = {group = "com.github.chuckerteam.chucker", name ="library", version.ref= "chucker"}
coil = { group = "io.coil-kt", name ="coil-compose", version.ref = "coil"}

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

gson = { group = "com.google.code.gson", name ="gson", version.ref = "gson"}
retrofit = { group = "com.squareup.retrofit2", name ="retrofit", version.ref = "retrofit"}
retrofit-converter = { group = "com.squareup.retrofit2", name ="converter-gson", version.ref = "retrofit"}
okhttp = { group = "com.squareup.okhttp3", name ="okhttp", version.ref = "okhttp"}
okhttp-urlconnection = { group = "com.squareup.okhttp3", name ="okhttp-urlconnection", version.ref = "okhttp"}
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name ="logging-interceptor", version.ref = "okhttp"}

coroutines-core = { group = "org.jetbrains.kotlinx", name ="kotlinx-coroutines-core", version.ref = "coroutinesCore"}
coroutines-android = { group = "org.jetbrains.kotlinx", name ="kotlinx-coroutines-android", version.ref = "coroutinesAndroid"}

paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "pagingVersion"}

# Navigation
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragment" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationFragment" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

# Google Sign-In
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
credentials-manager = { group = "androidx.credentials", name = "credentials", version.ref = "credentialsManager" }
credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentialsManager" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version = "1.1.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
android-library = { id = "com.android.library", version.ref = "agp" }
hilt-library = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp-library = { id ="com.google.devtools.ksp", version.ref = "ksp" }

